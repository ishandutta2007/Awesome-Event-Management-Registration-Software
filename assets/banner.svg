<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360" style="background:#090d16; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e1a"/>
      <stop offset="50%" stop-color="#0e1726"/>
      <stop offset="100%" stop-color="#161233"/>
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="primary-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>

    <linearGradient id="ticket-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>

    <linearGradient id="badge-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>

    <!-- Filters for Glow -->
    <filter id="glow-primary" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="subtle-glow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <style>
    @keyframes pulseOrb {
      0% { transform: scale(1) translate(0px, 0px); opacity: 0.35; }
      50% { transform: scale(1.18) translate(15px, -10px); opacity: 0.65; }
      100% { transform: scale(1) translate(0px, 0px); opacity: 0.35; }
    }
    @keyframes floatParticle {
      0% { transform: translateY(0px) rotate(0deg); opacity: 0.2; }
      50% { transform: translateY(-25px) rotate(180deg); opacity: 0.8; }
      100% { transform: translateY(0px) rotate(360deg); opacity: 0.2; }
    }
    @keyframes waveDash {
      0% { stroke-dashoffset: 0; }
      100% { stroke-dashoffset: 120; }
    }
    @keyframes radarSweep {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .orb-1 { animation: pulseOrb 8s ease-in-out infinite; transform-origin: 200px 100px; }
    .orb-2 { animation: pulseOrb 10s ease-in-out infinite reverse; transform-origin: 1000px 260px; }
    .flow-line { animation: waveDash 12s linear infinite; }
    .radar { animation: radarSweep 14s linear infinite; transform-origin: 1040px 180px; }
    .particle-1 { animation: floatParticle 6s ease-in-out infinite; }
    .particle-2 { animation: floatParticle 8s ease-in-out infinite 1s; }
    .particle-3 { animation: floatParticle 7s ease-in-out infinite 2s; }
  </style>

  <!-- Deep Background Layer -->
  <rect width="1200" height="360" fill="url(#bg-grad)"/>

  <!-- Grid Pattern -->
  <g opacity="0.12" stroke="#4f46e5" stroke-width="1">
    <line x1="0" y1="60" x2="1200" y2="60"/>
    <line x1="0" y1="120" x2="1200" y2="120"/>
    <line x1="0" y1="180" x2="1200" y2="180"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="120" y1="0" x2="120" y2="360"/>
    <line x1="240" y1="0" x2="240" y2="360"/>
    <line x1="360" y1="0" x2="360" y2="360"/>
    <line x1="480" y1="0" x2="480" y2="360"/>
    <line x1="600" y1="0" x2="600" y2="360"/>
    <line x1="720" y1="0" x2="720" y2="360"/>
    <line x1="840" y1="0" x2="840" y2="360"/>
    <line x1="960" y1="0" x2="960" y2="360"/>
    <line x1="1080" y1="0" x2="1080" y2="360"/>
  </g>

  <!-- Animated Ambient Orbs (Background only, won't obscure text) -->
  <circle class="orb-1" cx="180" cy="110" r="140" fill="#6366f1" filter="url(#glow-primary)" opacity="0.25"/>
  <circle class="orb-2" cx="1020" cy="240" r="150" fill="#ec4899" filter="url(#glow-primary)" opacity="0.22"/>
  <circle class="orb-1" cx="620" cy="300" r="100" fill="#06b6d4" filter="url(#glow-primary)" opacity="0.15"/>

  <!-- Right Side Decorative Elements: Stage / Radar / Ticket Graphics -->
  <g opacity="0.35" class="radar">
    <circle cx="1040" cy="180" r="110" fill="none" stroke="#6366f1" stroke-width="1.5" stroke-dasharray="4 6"/>
    <circle cx="1040" cy="180" r="75" fill="none" stroke="#8b5cf6" stroke-width="1.5"/>
    <circle cx="1040" cy="180" r="40" fill="none" stroke="#ec4899" stroke-width="1.5" stroke-dasharray="3 3"/>
    <line x1="1040" y1="70" x2="1040" y2="290" stroke="#a855f7" stroke-width="1" opacity="0.5"/>
    <line x1="930" y1="180" x2="1150" y2="180" stroke="#a855f7" stroke-width="1" opacity="0.5"/>
  </g>

  <!-- Flowing Dynamic Waves in background -->
  <path class="flow-line" d="M-50,280 C300,340 500,220 800,290 C980,330 1100,260 1250,280" fill="none" stroke="url(#primary-grad)" stroke-width="2.5" opacity="0.4" stroke-dasharray="8 8"/>
  <path class="flow-line" d="M-50,295 C250,230 550,330 850,260 C1020,220 1150,300 1250,295" fill="none" stroke="#06b6d4" stroke-width="1.8" opacity="0.35" stroke-dasharray="6 6"/>

  <!-- Floating Decorative Particles -->
  <circle class="particle-1" cx="890" cy="90" r="4" fill="#38bdf8"/>
  <polygon class="particle-2" points="980,60 985,72 973,68" fill="#f472b6"/>
  <circle class="particle-3" cx="1120" cy="120" r="3.5" fill="#a78bfa"/>
  <rect class="particle-1" x="780" y="240" width="6" height="6" fill="#34d399" transform="rotate(45 783 243)"/>

  <!-- Foreground Main Title and Headers (Highest z-order layer, crystal clear) -->
  <g>
    <!-- Top Pill / Category Tag -->
    <rect x="75" y="46" width="285" height="32" rx="16" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.2"/>
    <circle cx="93" cy="62" r="5" fill="#10b981"/>
    <text x="108" y="68" fill="#e0e7ff" font-size="12.5" font-weight="700" letter-spacing="1.2">CURATED DIRECTORY 2026</text>

    <!-- Main Title -->
    <text x="75" y="135" fill="#ffffff" font-size="44" font-weight="900" letter-spacing="-0.5">Awesome Event Management</text>
    <text x="75" y="185" fill="url(#primary-grad)" font-size="38" font-weight="800">&amp; Registration Software 🎟️✨</text>

    <!-- Subtitle / Tagline -->
    <text x="76" y="232" fill="#94a3b8" font-size="16" font-weight="400">
      The authoritative guide to SaaS platforms, enterprise suites &amp; self-hosted open-source ticketing engines.
    </text>

    <!-- Bottom Feature Badges / Highlights -->
    <g transform="translate(76, 268)">
      <!-- Badge 1 -->
      <rect x="0" y="0" width="135" height="28" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="12" y="18" fill="#cbd5e1" font-size="12" font-weight="600">🎪 SaaS Platforms</text>

      <!-- Badge 2 -->
      <rect x="147" y="0" width="155" height="28" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="12" y="18" fill="#cbd5e1" font-size="12" font-weight="600" transform="translate(147, 0)">⚡ Self-Hosted FOSS</text>

      <!-- Badge 3 -->
      <rect x="314" y="0" width="140" height="28" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="12" y="18" fill="#cbd5e1" font-size="12" font-weight="600" transform="translate(314, 0)">🏷️ Transparent Pricing</text>

      <!-- Badge 4 -->
      <rect x="466" y="0" width="145" height="28" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="12" y="18" fill="#cbd5e1" font-size="12" font-weight="600" transform="translate(466, 0)">📊 Market Dynamics</text>
    </g>
  </g>

  <!-- Sleek Border Framing -->
  <rect x="1" y="1" width="1198" height="358" rx="0" fill="none" stroke="#312e81" stroke-width="1.5" opacity="0.6"/>
</svg>